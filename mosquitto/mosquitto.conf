# Ice-Traffic-Data Broker
per_listener_settings true
persistence true
persistence_location /mosquitto/data/

# Intern: Decoder (Docker-Netz) + LAN-Tests, anonym. Auf dem Host nur im LAN veroeffentlicht (Port 1885).
listener 1883
allow_anonymous true

# Oeffentlich (Auto ueber iPhone-Hotspot): TLS, Passwort, Schreibrecht nur auf its/+/...
listener 18883
protocol mqtt
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
