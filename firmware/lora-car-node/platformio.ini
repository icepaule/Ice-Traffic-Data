; ENTWURF (DRAFT): LoRa-Auto-Knoten fuer Seeed XIAO ESP32S3 + Wio-SX1262. Noch nicht auf Hardware getestet.
[platformio]
default_envs = xiao_esp32s3

[env:xiao_esp32s3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@7.8.1
    mikalhart/TinyGPSPlus@1.0.3
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Reine Rechenlogik ohne Hardware (Frame-Parser + Nutzlast) auf dem PC testen:  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I src
